name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Internal materials must not be committed
        run: |
          # 推广方案、运营材料、对话记录属于仓库外材料，禁止进入公开仓库
          hits=$(git ls-files | grep -Ei '(^|/)(promotion|internal|ops)(/|[-_.])' || true)
          if [ -n "$hits" ]; then
            echo "::error::检测到内部材料入库：$hits"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile scripts/*.py demo.py

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: python -m pytest tests/ -v --cov=scripts --cov-report=term-missing --cov-fail-under=78

      - name: README anchors and structure
        run: python scripts/check_toc.py

      - name: README fact audit
        run: python scripts/audit_readme.py

      - name: README release highlights in sync
        run: python scripts/sync_readme.py --check

      - name: Release artifacts consistency
        run: python scripts/build_releases.py --verify --no-zip-check

      - name: CLI smoke test
        run: |
          python scripts/mcd.py --help
          python scripts/mcd.py call --help
          python scripts/mcd.py schema --help

      - name: Missing-token error path
        run: |
          # 无 Token 时应优雅失败并返回退出码 2（鉴权错误），而非崩溃
          set +e
          python scripts/mcd.py check
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2 (auth error), got $code"
            exit 1
          fi
        env:
          MCD_MCP_TOKEN: ""
          MCD_MCP_TOKEN_FILE: "/dev/null"

  # Windows 是主要使用场景（中文路径、PowerShell、install.ps1），单跑一次 3.9 保证平台分支可达
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Syntax check
        run: python -m compileall -q scripts demo.py

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Installer dry run
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Target workbuddy
          $target = Join-Path $HOME ".workbuddy\skills\mcd-saver"
          foreach ($item in @('SKILL.md','README.md','CHANGELOG.md','scripts','references')) {
            if (-not (Test-Path (Join-Path $target $item))) {
              Write-Error "安装结果缺少 $item"
              exit 1
            }
          }
