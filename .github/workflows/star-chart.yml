name: star-chart

# 每日重算 README 的 Star 历史曲线（scripts/gen_star_chart.py 生成 SVG）。
# 曲线是仓库内资产：每次重算后若内容有变化则自动提交，README 始终能渲染且不依赖第三方服务。

on:
  schedule:
    - cron: "17 3 * * *"   # 每天 11:17（UTC+8）
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: star-chart
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 Star 曲线
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_star_chart.py

      - name: 有变化则提交
        run: |
          if git diff --quiet -- docs/assets/star-history.svg; then
            echo "曲线无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/star-history.svg
          git commit -m "chore: 更新 Star 历史曲线"
          git push
